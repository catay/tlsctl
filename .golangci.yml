version: "2"

linters:
  default: standard
  enable:
    - gocritic
    - revive
    - misspell

  settings:
    revive:
      rules:
        - name: var-naming
        - name: blank-imports
        - name: error-return
        - name: unreachable-code

  exclusions:
    presets:
      - common-false-positives
      - std-error-handling
