name: CI

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".goreleaser.yaml"
      - ".golangci.yml"
      - "Dockerfile.goreleaser"
      - "VERSION"
      - "Dockerfile"
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          output=$(gofmt -s -l .)
          if [ -n "$output" ]; then
            echo "The following files are not formatted:"
            echo "$output"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -cover ./...

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vuln

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip publish

      - name: Check source container
        run: |
          docker build -t tlsctl:ci .
          docker run --rm tlsctl:ci version
          docker run --rm tlsctl:ci client --help
          if printf 'invalid PEM' | docker run --rm -i tlsctl:ci pem -o json - > result.json; then
            echo "Invalid PEM unexpectedly succeeded" >&2
            exit 1
          else
            test "$?" -eq 1
          fi
          test "$(jq -r '.status' result.json)" = failure
          test "$(jq -r '.results[0].target' result.json)" = stdin
          docker run --rm --platform linux/amd64 cataybe/tlsctl:latest-amd64 version
